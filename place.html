<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place I Visited</title>
    <meta name="description" content="WDD 131 | Dynamic Web Fundamentals A country I visited">
    <meta name="author" content="Karissa Holt">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">
    <script src="scripts/place.js" defer></script>
</head>

<body>
    <header>
        <h1>Italy</h1>
    </header>
    <div class="hero">
        <picture>
            <source srcset="images/rome-italy-temple-hero-large.webp" media="(min-width: 700px)">
            <img src="images/rome-italy-temple-hero-mobile.webp" alt="Rome Italy Temple" width="1500" height="750">
        </picture>
        <section class="data-card">
            <div class="data-title">
                <h2>Data</h2>
            </div>
            <div class="data-content">
                <p><span class="label">Area:</span> <span class="value"> 301,340 sq km</span></p>
                <p><span class="label">Population:</span> <span class="value"> 58,870,000</span></p>
                <p><span class="label">Capitol:</span> <span class="value"> Rome</span></p>
                <p><span class="label">Languages:</span> <span class="value"> Italian</span></p>
                <p><span class="label">Currency:</span> <span class="value"> Euro</span></p>
                <p><span class="label">Time Zone:</span> <span class="value"> UTC+1</span></p>
                <p><span class="label">Calling Code:</span> <span class="value"> +39</span></p>
                <p><span class="label">Internet TLD:</span> <span class="value"> .it</span></p>
            </div>
        </section>
        <section class="weather-card">
            <div class="weather-title">
                <h2>Weather</h2>
            </div>
            <img class="weather-svg" src="images/weather.svg" alt="Partly Cloudy weather icon">
            <div class="weather-content">
                <p><span class="label">Temperature:</span> <span class="value"> 24°C</span></p>
                <p><span class="label">Conditions:</span> <span class="value"> Partly Cloudy</span></p>
                <p><span class="label">Wind:</span> <span class="value"> 11 km/h</span></p>
                <p><span class="label">Wind Chill:</span> <span class="value" id="windchill"></span></p>
            </div>
        </section>
    </div>
    </header>
    <footer>
        <p>&copy;<span id="currentyear"></span> 🌸 Karissa Holt 🌸 Utah</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
