<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Form practice for WDD131 week 5">
    <meta name="author" content="Karissa Holt">
    <title>Form Best Practices</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <h1>Product Review</h1>
    <main>
        <form method="get" action="review.html" class="review-form">
            <label>Product Name*
                <select name="productName" id="productName" required>
                    <option value="" disabled selected>Select a Product...</option>
                </select>
            </label>
            <fieldset class="rating">
                <legend>Overall Rating*</legend>
                <label><span>&star; </span>
                    <input type="radio" name="rating" id="rating1" value="1" required></label>
                <label><span>&star;&star; </span>
                    <input type="radio" name="rating" id="rating2" value="2" required></label>
                <label><span>&star;&star;&star; </span>
                    <input type="radio" name="rating" id="rating3" value="3" required></label>
                <label><span>&star;&star;&star;&star; </span>
                    <input type="radio" name="rating" id="rating4" value="4" required></label>
                <label><span>&star;&star;&star;&star;&star; </span>
                    <input type="radio" name="rating" id="rating5" value="5" required></label>
            </fieldset>
            <label>Date of Installation* <input type="date" name="installDate" required></label>
            <fieldset class="features">
                <legend>
                    Which features did you find useful in the product?<br>
                    <em>(Check all that apply)</em>
                </legend>
                <label>
                    <input type="checkbox"  id="durability" name="features" value="Durability">Durability
                </label>
                <label>
                    <input type="checkbox"  id="easeOfUse" name="features" value="Ease of Use">Ease of Use
                </label>
                <label>
                    <input type="checkbox"  id="performance" name="features" value="Performance">Performance
                </label>
                <label>
                    <input type="checkbox"  id="design" name="features" value="Design">Design
                </label>
            </fieldset>
            <label>Written Review <span>(Optional)</span>
                <textarea id="writtenReview" name="writtenReview"></textarea>
            </label>
            <label>Your Name <span>(Optional)</span>
                <input type="text" id="userName" name="userName">
            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> 🌸 Karissa Holt 🌸 Utah</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
